name: research-worker

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Worker mode"
        required: true
        type: choice
        default: full-batch
        options:
          - full-batch
          - enumerate-only
      batch_size:
        description: "Optional batch size override"
        required: false
        type: string
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: research-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out production base
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Require DeepSeek credentials without exposing them
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          test -n "$DEEPSEEK_API_KEY" || {
            echo "DEEPSEEK_API_KEY is not configured; refusing to run evidence-only mode" >&2
            exit 1
          }

      - name: Run one resumable cloud batch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.8j.ink/v1
          DEEPSEEK_MODEL: deepseek-v4-pro
          WORKER_MODE: ${{ inputs.mode || 'full-batch' }}
          WORKER_BATCH_SIZE: ${{ inputs.batch_size || '' }}
        run: |
          set -euo pipefail
          args=(--mode "$WORKER_MODE")
          if [[ -n "$WORKER_BATCH_SIZE" ]]; then
            args+=(--batch-size "$WORKER_BATCH_SIZE")
          fi
          .venv/bin/python scripts/research_worker.py "${args[@]}"

      - name: Create or update research PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="data/research-$(date -u +%Y-%m-%d)-accumulation"
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number -q '.[0].number')
            if [[ -n "$EXISTING" ]]; then
              echo "PR #$EXISTING already exists for branch $BRANCH"
            else
              gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
                --title "data: research accumulation" \
                --body "Continuous research accumulation. Automated by research-worker."
            fi
          else
            echo "Branch $BRANCH does not exist; skipping PR creation"
          fi

      - name: Report durable cursor location
        if: always()
        run: |
          echo "worker completed; the next_since cursor is stored in the data PR manifest"
